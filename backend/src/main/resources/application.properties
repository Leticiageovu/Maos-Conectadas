spring.application.name=maos-conectadas
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/maos_conectadas}
spring.datasource.username=${DATABASE_USERNAME:maos}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
management.endpoints.web.exposure.include=health,info
